<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashu Chat | Ultra Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        
        /* Ultra Premium Glass Effects */
        .glass-panel {
            background: linear-gradient(145deg, rgba(20,20,20,0.8) 0%, rgba(5,5,5,0.9) 100%);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 16px;
        }
        
        /* Input & Button Styling */
        .premium-input {
            background: #0a0a0a; 
            border: 1px solid #1f1f22; 
            color: #fff; 
            transition: all 0.3s ease;
        }
        .premium-input:focus {
            border-color: #444; 
            box-shadow: 0 0 15px rgba(255,255,255,0.05); 
            outline: none;
        }
        .premium-btn {
            background: #fff; 
            color: #000; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .premium-btn:hover { 
            background: #e0e0e0; 
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* Animations */
        .fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-out-down { animation: fadeOutDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes fadeOutDown {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(20px); visibility: hidden; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-screen selection:bg-white selection:text-black">

    <div id="screen1" class="text-center p-8 max-w-md w-full fade-in-up absolute z-10">
        <div class="w-16 h-16 bg-white/10 rounded-2xl mx-auto mb-6 flex items-center justify-center border border-white/5 shadow-2xl">
            <div class="w-8 h-8 bg-white rounded-full"></div>
        </div>
        <h1 class="text-4xl font-bold tracking-tight mb-4">Hashu Chat</h1>
        <p class="text-[#888] mb-10 text-sm leading-relaxed">Experience the next generation of secure communication. Tap below to enter the premium ecosystem.</p>
        <button onclick="goToRegister()" class="premium-btn w-full py-4 rounded-xl font-semibold tracking-wide">Agree and continue</button>
    </div>

    <div id="screen2" class="hidden glass-panel p-10 max-w-sm w-full text-center absolute z-20">
        <div class="mb-8">
            <h2 class="text-2xl font-semibold text-white mb-2">Create Identity</h2>
            <p class="text-[#888] text-xs">Secure your spot in the network.</p>
        </div>
        <div class="space-y-4 mb-8">
            <input id="userName" placeholder="Full Name" autocomplete="off" class="premium-input w-full p-4 rounded-xl text-sm placeholder-gray-600">
            <input id="userPhone" placeholder="Phone Number" autocomplete="off" class="premium-input w-full p-4 rounded-xl text-sm placeholder-gray-600">
        </div>
        <button id="regBtn" onclick="registerUser()" class="premium-btn w-full py-4 rounded-xl font-semibold">Start Chatting</button>
    </div>

    <div id="screen3" class="hidden w-full h-full flex flex-col md:flex-row absolute bg-[#000] z-30">
        
        <div class="w-full md:w-[320px] border-r border-[#111] bg-[#030303] flex flex-col">
            <div class="p-6 border-b border-[#111] flex items-center gap-4">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-black font-bold">H</div>
                <div>
                    <h2 class="font-semibold text-md text-white">Hashu Network</h2>
                    <p class="text-[10px] text-green-500 uppercase tracking-widest mt-1">Encrypted</p>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <div class="p-4 bg-[#0a0a0a] border border-[#1a1a1a] rounded-xl cursor-pointer hover:border-white/20 transition-all">
                    <p class="font-medium text-sm text-white">Global Lounge</p>
                    <p class="text-xs text-[#666] mt-1">Main communication hub</p>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-black relative">
            <div class="p-6 border-b border-[#111] backdrop-blur-xl bg-black/60 z-10 sticky top-0 flex justify-between items-center">
                <h3 class="font-medium text-white tracking-wide">Global Lounge</h3>
                <div class="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]"></div>
            </div>
            
            <div id="chatLog" class="flex-1 overflow-y-auto p-6 space-y-6"></div>

            <div class="p-6 border-t border-[#111] bg-[#030303]">
                <div class="flex gap-3 max-w-5xl mx-auto relative">
                    <input id="chatInput" placeholder="Write something..." class="premium-input flex-1 p-4 rounded-xl text-sm" onkeypress="handleEnter(event)">
                    <button onclick="sendMessage()" class="premium-btn px-8 rounded-xl font-medium">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ඔයාගේ Backend එක අප්ලෝඩ් කරාම ඒකේ ලින්ක් එක මෙතන දාන්න.
        // දැනට මේක localhost තියෙන්නේ. (Frontend එකේ ලින්ක් එක මෙතන දැම්මොත් වැඩ කරන්නේ නෑ!)
        const BACKEND_URL = "http://localhost:3000"; 

        let currentUserName = "";

        function goToRegister() {
            const s1 = document.getElementById('screen1');
            const s2 = document.getElementById('screen2');
            s1.classList.remove('fade-in-up');
            s1.classList.add('fade-out-down');
            setTimeout(() => {
                s1.classList.add('hidden');
                s2.classList.remove('hidden');
                s2.classList.add('fade-in-up');
            }, 400);
        }

        async function registerUser() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const btn = document.getElementById('regBtn');

            if (!name || !phone) {
                alert("Please complete all fields.");
                return;
            }

            currentUserName = name;
            btn.innerHTML = "Authenticating...";
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const response = await fetch(`${BACKEND_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone })
                });

                if (!response.ok) throw new Error("Server rejected connection");

                const s2 = document.getElementById('screen2');
                const s3 = document.getElementById('screen3');
                s2.classList.remove('fade-in-up');
                s2.classList.add('fade-out-down');

                setTimeout(() => {
                    s2.classList.add('hidden');
                    s3.classList.remove('hidden');
                    s3.classList.add('fade-in-up');
                    loadMessages();
                    setInterval(loadMessages, 3000); // Live Reload
                }, 400);

            } catch (error) {
                btn.innerHTML = "Start Chatting";
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                alert("Error connecting to Backend Server. Please check BACKEND_URL.");
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = ""; 
            
            try {
                await fetch(`${BACKEND_URL}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: currentUserName, text: text })
                });
                loadMessages();
            } catch (error) {
                console.error("Failed to send", error);
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function loadMessages() {
            try {
                const res = await fetch(`${BACKEND_URL}/messages`);
                const messages = await res.json();
                const chatLog = document.getElementById('chatLog');
                
                chatLog.innerHTML = messages.map(msg => {
                    const isMe = msg.name === currentUserName;
                    return `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-[75%] px-5 py-3 ${
                                isMe 
                                ? 'bg-white text-black rounded-2xl rounded-br-sm' 
                                : 'bg-[#111] border border-[#222] text-white rounded-2xl rounded-bl-sm'
                            }">
                                ${!isMe ? `<div class="text-[10px] text-[#888] mb-1 font-bold uppercase tracking-wider">${msg.name}</div>` : ''}
                                <div class="text-sm leading-relaxed">${msg.text}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                chatLog.scrollTop = chatLog.scrollHeight;
            } catch (error) {
                console.error("Failed to load");
            }
        }
    </script>
</body>
    </html>
