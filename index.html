<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashu Chat | Single File Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #fff; font-family: sans-serif; }
    </style>
</head>
<body class="flex flex-col h-screen p-4">

    <div id="chatLog" class="flex-1 overflow-y-auto mb-4 p-4 bg-gray-900 rounded-xl space-y-2">
        </div>

    <div class="flex gap-2">
        <input id="userName" placeholder="Your Name" class="p-3 bg-gray-800 rounded-lg w-1/4 text-white">
        <input id="chatInput" placeholder="Message..." class="p-3 bg-gray-800 rounded-lg flex-1 text-white">
        <button onclick="sendMessage()" class="p-3 bg-blue-600 rounded-lg font-bold">Send</button>
    </div>

    <script>
        // මේක තමයි ඔයාගේ MongoDB Data API එකේ විස්තර දාන්න ඕන තැන
        const DATA_API_URL = "https://data.mongodb-api.com/app/YOUR_APP_ID/endpoint/data/v1"; 
        const API_KEY = "YOUR_API_KEY_HERE"; 
        const CLUSTER_NAME = "hashuserver2"; 
        const DB_NAME = "hashubug"; 

        async function mongoFetch(action, collection, payload) {
            return await fetch(`${DATA_API_URL}/action/${action}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'api-key': API_KEY
                },
                body: JSON.stringify({
                    dataSource: CLUSTER_NAME,
                    database: DB_NAME,
                    collection: collection,
                    ...payload
                })
            });
        }

        async function sendMessage() {
            const name = document.getElementById('userName').value.trim();
            const text = document.getElementById('chatInput').value.trim();
            if (!name || !text) return alert("Name and Message required!");
            
            document.getElementById('chatInput').value = "";
            
            await mongoFetch('insertOne', 'Chats', {
                document: { name, text, timestamp: new Date() }
            });
            loadMessages();
        }

        async function loadMessages() {
            const res = await mongoFetch('find', 'Chats', { sort: { timestamp: 1 } });
            const data = await res.json();
            const chatLog = document.getElementById('chatLog');
            chatLog.innerHTML = (data.documents || []).map(msg => 
                `<div><b class="text-blue-400">${msg.name}:</b> ${msg.text}</div>`
            ).join('');
        }

        setInterval(loadMessages, 3000);
        loadMessages();
    </script>
</body>
</html>
