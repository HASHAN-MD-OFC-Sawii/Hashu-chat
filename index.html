<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hashu Chat | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #000000; 
            color: #ededed; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }
        
        /* Premium Vercel Elements */
        .v-card {
            background: linear-gradient(180deg, rgba(24,24,27,0.6) 0%, rgba(0,0,0,1) 100%);
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 12px;
        }
        .v-input {
            background: #0a0a0a; 
            border: 1px solid #27272a; 
            color: #fff; 
            transition: all 0.2s ease;
        }
        .v-input:focus {
            border-color: #ffffff; 
            box-shadow: 0 0 0 1px #ffffff; 
            outline: none;
        }
        .v-btn-primary {
            background: #ffffff; 
            color: #000000; 
            transition: all 0.2s ease;
        }
        .v-btn-primary:hover { 
            background: #e5e5e5; 
            transform: translateY(-1px); 
        }
        
        /* Smooth Animations */
        .anim-enter { animation: fadeSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .anim-exit { animation: fadeSlideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideDown {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }

        /* Custom Scrollbar for Chat */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-screen selection:bg-white selection:text-black">

    <div id="screen1" class="text-center p-8 max-w-md w-full anim-enter absolute">
        <h1 class="text-4xl font-semibold tracking-tight mb-4 text-white">Welcome Hashu Chat</h1>
        <p class="text-[#a1a1aa] mb-10 text-sm leading-relaxed">Read our Privacy Policies. Tap "Agree and continue" to accept our Terms of Service and enter the premium ecosystem.</p>
        <button onclick="goToRegister()" class="v-btn-primary w-full py-3.5 rounded-lg font-medium tracking-wide">Agree and continue</button>
    </div>

    <div id="screen2" class="hidden v-card p-10 max-w-sm w-full text-center absolute">
        <div class="mb-8">
            <h2 class="text-2xl font-medium text-white mb-2">Create Profile</h2>
            <p class="text-[#a1a1aa] text-xs">Enter your details to join the network.</p>
        </div>
        <div class="space-y-4 mb-8">
            <input id="userName" placeholder="Full Name" autocomplete="off" class="v-input w-full p-3.5 rounded-lg text-sm placeholder-gray-600">
            <input id="userPhone" placeholder="Phone Number" autocomplete="off" class="v-input w-full p-3.5 rounded-lg text-sm placeholder-gray-600">
        </div>
        <button id="regBtn" onclick="registerUser()" class="v-btn-primary w-full py-3.5 rounded-lg font-medium">Start Chatting</button>
    </div>

    <div id="screen3" class="hidden w-full h-full flex flex-col md:flex-row absolute bg-[#000]">
        
        <div class="w-full md:w-[320px] border-r border-[#1f1f22] bg-[#050505] flex flex-col">
            <div class="p-6 border-b border-[#1f1f22]">
                <h2 class="font-semibold text-lg text-white">Hashu Chat</h2>
                <p class="text-xs text-[#a1a1aa] mt-1">Premium Support Server</p>
            </div>
            <div class="flex-1 overflow-y-auto p-4">
                <div class="p-3 bg-[#111] border border-[#222] rounded-lg cursor-pointer hover:bg-[#1a1a1a] transition">
                    <p class="font-medium text-sm text-white">Global Chat Room</p>
                    <p class="text-xs text-green-500 mt-1">Online</p>
                </div>
            </div>
        </div>

        <div class="flex-1 flex flex-col bg-black relative">
            <div class="p-6 border-b border-[#1f1f22] backdrop-blur-md bg-black/80 z-10 sticky top-0">
                <h3 class="font-medium text-white">Global Chat Room</h3>
            </div>
            
            <div id="chatLog" class="flex-1 overflow-y-auto p-6 space-y-4">
                </div>

            <div class="p-6 border-t border-[#1f1f22] bg-[#050505]">
                <div class="flex gap-3 max-w-4xl mx-auto relative">
                    <input id="chatInput" placeholder="Type a message..." class="v-input flex-1 p-4 rounded-xl text-sm" onkeypress="handleEnter(event)">
                    <button onclick="sendMessage()" class="v-btn-primary px-8 rounded-xl font-medium">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUserName = "";

        // UI Transition: Welcome -> Register
        function goToRegister() {
            const s1 = document.getElementById('screen1');
            const s2 = document.getElementById('screen2');
            
            s1.classList.remove('anim-enter');
            s1.classList.add('anim-exit');
            
            setTimeout(() => {
                s1.classList.add('hidden');
                s2.classList.remove('hidden');
                s2.classList.add('anim-enter');
            }, 400);
        }

        // Logic: Save to MongoDB & Switch to Dashboard
        async function registerUser() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();
            const btn = document.getElementById('regBtn');

            if (!name || !phone) {
                alert("Please enter both Name and Phone Number.");
                return;
            }

            currentUserName = name;
            btn.innerHTML = "Connecting...";
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                // Backend call to save User
                await fetch('http://localhost:3000/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone })
                });

                // UI Transition: Register -> Dashboard
                const s2 = document.getElementById('screen2');
                const s3 = document.getElementById('screen3');
                
                s2.classList.remove('anim-enter');
                s2.classList.add('anim-exit');

                setTimeout(() => {
                    s2.classList.add('hidden');
                    s3.classList.remove('hidden');
                    s3.classList.add('anim-enter');
                    loadMessages(); // Load chats immediately
                }, 400);

            } catch (error) {
                console.error("Error connecting to server", error);
                btn.innerHTML = "Start Chatting";
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                alert("Server error. Is your Node.js backend running?");
            }
        }

        // Logic: Send Message to MongoDB
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (!text) return;

            input.value = ""; // Clear input
            
            try {
                await fetch('http://localhost:3000/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: currentUserName, text: text })
                });
                loadMessages(); // Refresh chat log
            } catch (error) {
                console.error("Failed to send message", error);
            }
        }

        // Enter key to send message
        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Logic: Fetch Messages from MongoDB
        async function loadMessages() {
            try {
                const res = await fetch('http://localhost:3000/messages');
                const messages = await res.json();
                const chatLog = document.getElementById('chatLog');
                
                chatLog.innerHTML = messages.map(msg => {
                    const isMe = msg.name === currentUserName;
                    return `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-[70%] rounded-2xl px-5 py-3 ${
                                isMe 
                                ? 'bg-white text-black rounded-br-none' 
                                : 'bg-[#111] border border-[#222] text-white rounded-bl-none'
                            }">
                                ${!isMe ? `<div class="text-[10px] text-gray-500 mb-1 font-semibold uppercase tracking-wider">${msg.name}</div>` : ''}
                                <div class="text-sm leading-relaxed">${msg.text}</div>
                            </div>
                        </div>
                    `;
                }).join('');
                
                // Auto scroll to bottom
                chatLog.scrollTop = chatLog.scrollHeight;
            } catch (error) {
                console.error("Failed to load messages", error);
            }
        }
    </script>
</body>
                </html>
